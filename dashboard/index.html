<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQTT Signage Controller - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <span class="pulse"></span>
                <h1>Signage<span>Control</span></h1>
            </div>
            <div class="status-badge" id="broker-status">
                <div class="indicator"></div>
                <span>Connecting...</span>
            </div>
        </header>

        <main>
            <section class="overview-grid">
                <div class="card stat-card">
                    <h3>Active Screens</h3>
                    <p id="active-screens-count">0</p>
                    <div class="mini-chart" id="screen-trend"></div>
                </div>
                <div class="card stat-card">
                    <h3>Current Alert</h3>
                    <p id="current-alert" class="alert-none">No active alerts</p>
                </div>
                <div class="card stat-card">
                    <h3>Network Load</h3>
                    <p id="network-load">Low</p>
                </div>
            </section>

            <section class="content-row">
                <div class="card screen-list-card">
                    <div class="card-header">
                        <h2>Fleet Overview</h2>
                        <button class="btn-refresh" id="btn-refresh">Refresh</button>
                    </div>
                    <div class="screen-grid" id="screen-grid">
                        <!-- Screens will be injected here -->
                    </div>
                </div>

                <div class="card action-card">
                    <h2>Quick Actions</h2>
                    <div class="action-grid">
                        <button class="action-btn emergency" id="btn-fire">
                            <span class="icon">🔥</span>
                            Fire Alert
                        </button>
                        <button class="action-btn promo" id="btn-promo">
                            <span class="icon">🛍️</span>
                            Push Promo
                        </button>
                        <button class="action-btn update" id="btn-clear">
                            <span class="icon">🧹</span>
                            Clear Alerts
                        </button>
                    </div>
                    
                    <div class="log-container">
                        <h3>Event Log</h3>
                        <div id="event-log" class="log-list"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="js/dashboard.js"></script>
</body>
</html>
