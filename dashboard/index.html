<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signage Control</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/grid.css">
  <link rel="stylesheet" href="css/content.css">
  <link rel="stylesheet" href="css/analytics.css">
  <link rel="stylesheet" href="css/notif.css">
  <link rel="stylesheet" href="css/audit.css">
</head>
<body>
  <div id="app">

    <header id="topbar">
      <div id="topbar-brand">
        <span id="topbar-title">Signage Control</span>
        <span id="topbar-subtitle">Network Operations</span>
      </div>
      <div id="topbar-kpis" aria-label="Fleet summary">
        <span class="topbar-kpi"><span id="kpi-total">0</span><span>Total</span></span>
        <span class="topbar-kpi ok"><span id="kpi-online">0</span><span>Online</span></span>
        <span class="topbar-kpi danger"><span id="kpi-offline">0</span><span>Offline</span></span>
        <span class="topbar-kpi alert"><span id="kpi-alerts">0</span><span>Alerts</span></span>
      </div>
      <div id="topbar-right">
        <div id="notif-popover-wrap">
          <button id="notif-bell" aria-label="Notifications" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 2a6 6 0 0 1 6 6v3l1.5 2.5h-15L4 11V8a6 6 0 0 1 6-6z"/>
              <path d="M8 16.5a2 2 0 0 0 4 0"/>
            </svg>
            <span id="notif-bell-badge" aria-live="polite"></span>
          </button>
          <div id="notif-popover" role="region" aria-label="Recent notifications"></div>
        </div>
        <div id="conn-status">
          <span id="conn-dot"></span>
          <span id="conn-label">Connecting...</span>
        </div>
        <span id="topbar-clock"></span>
      </div>
    </header>

    <div id="alert-ribbon">
      <div class="ribbon-content">
        <svg class="ribbon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <span id="ribbon-scope"></span>
        <span id="ribbon-message"></span>
        <span id="ribbon-count" class="ribbon-count"></span>
      </div>
      <button id="ribbon-dismiss" class="ribbon-dismiss" aria-label="Dismiss alert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <nav id="sidebar">
      <div id="nav-items"></div>
      <button id="sidebar-toggle" aria-label="Toggle sidebar"></button>
    </nav>

    <main id="content">
      <div id="page-map"           class="page"></div>
      <div id="page-grid"          class="page"></div>
      <div id="page-content-mgmt"  class="page"></div>
      <div id="page-analytics"     class="page"></div>
      <div id="page-notifications" class="page"></div>
      <div id="page-audit"         class="page"></div>
    </main>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/map.js"></script>
  <script src="js/pages/grid.js"></script>
  <script src="js/pages/content.js"></script>
  <script src="js/pages/analytics.js"></script>
  <script src="js/pages/notif.js"></script>
  <script src="js/pages/audit.js"></script>
</body>
</html>
