<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signage Control</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/grid.css">
</head>
<body>
  <div id="app">

    <header id="topbar">
      <span id="topbar-title">Signage Control</span>
      <div id="topbar-right">
        <div id="conn-status">
          <span id="conn-dot"></span>
          <span id="conn-label">Connecting...</span>
        </div>
        <span id="topbar-clock"></span>
      </div>
    </header>

    <nav id="sidebar">
      <div id="nav-items"></div>
      <button id="sidebar-toggle" aria-label="Toggle sidebar"></button>
    </nav>

    <main id="content">
      <div id="page-map"           class="page"></div>
      <div id="page-grid"          class="page"></div>
      <div id="page-content-mgmt"  class="page"></div>
      <div id="page-notifications" class="page"></div>
      <div id="page-audit"         class="page"></div>
    </main>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/map.js"></script>
  <script src="js/pages/grid.js"></script>
</body>
</html>
