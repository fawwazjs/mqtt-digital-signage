# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type all

# Listener for MQTT (Standard)
listener 1883
allow_anonymous true

# Listener for WebSockets (for Dashboard)
listener 9001
protocol websockets
allow_anonymous true

# MQTT 5.0 specific settings (Mosquitto supports them by default if version >= 2.0)
# Enable Shared Subscriptions (default is true in newer versions)
# Enable Flow Control (Receive Maximum)
max_queued_messages 1000
max_inflight_messages 20
